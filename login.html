<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الموظفين - نظام إدارة الإسعاف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background: white;
        }
        .login-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
        }
        .logo-shine {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(250, 109, 109, 0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .ministry-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .title-highlight {
            color: #0d6efd;
            font-weight: 700;
            font-size: 1.1em;
        }
        .ministry-name {
            color: #333;
            font-size: 0.9em;
        }
        .login-box {
            background: #ff837f;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
    </style>
</head>
<body style="height: 100vh; overflow: hidden; margin: 0; padding: 0; position: fixed; width: 100%;">
    <div class="container" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; position: relative;">
        <!-- نموذج تسجيل الدخول الرئيسي -->
        <div class="login-container" style="max-height: 80vh; overflow-y: auto; margin-bottom: auto;">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo-shine"></div>
                    <img src="logo.png" alt="شعار وزارة الصحة" class="ministry-logo">
                </div>
                <div class="title-container">
                    <h2><span class="title-highlight">نظام إدارة الإسعاف</span></h2>
                    <h2><span class="ministry-name">وزارة الصحة</span></h2>
                </div>
            </div>
            
            <!-- نموذج تسجيل دخول المسعف -->
            <div id="loginForm" class="login-box">
                <form id="medicLoginForm">
                    <div class="mb-3">
                        <label for="paramedicCode" class="form-label">كود المسعف</label>
                        <input type="text" id="paramedicCode" class="form-control text-center" 
                               placeholder="أدخل كود المسعف" required>
                    </div>
                    <div class="mb-3">
                        <label for="discordId" class="form-label">كلمة السر</label>
                        <input type="password" id="discordId" class="form-control text-center" 
                               placeholder="كلمة السر" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-4 text-muted" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9);">
        &copy; 2026 وزارة الصحة - جميع الحقوق محفوظة
    </footer>

    <!-- ملفات قاعدة البيانات المحلية -->
    <script type="module" src="database.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="shared.js"></script>
    
    <!-- ملف تسجيل الدخول -->
    <script src="login.js"></script>
    
    <script>
        // تحديث قائمة المسعفين في صفحة تسجيل الدخول
        function updateMedicSelect() {
            const medicsList = JSON.parse(localStorage.getItem('medicsList') || '[]');
            const medicSelect = document.getElementById('medicSelect');
            
            if (medicSelect) {
                medicSelect.innerHTML = '<option value="">-- اختر مسعف --</option>' + 
                    medicsList.map(medic => `<option value="${medic.id}">${medic.name} (${medic.code})</option>`).join('');
            }
        }

        // تبديل بين نماذج تسجيل الدخول
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const activeMedic = JSON.parse(localStorage.getItem('activeMedic'));
            const medicLogin = document.getElementById('medicLoginForm');
            const adminLogin = document.getElementById('adminLoginForm');
            
            if (currentUser && currentUser.type === 'admin') {
                // إخفاء نموذج المسعف وإظهار نموذج المدير
                if (medicLogin) medicLogin.style.display = 'none';
                if (adminLogin) adminLogin.style.display = 'block';
            } else if (activeMedic) {
                // إخفاء نموذج المدير وإظهار نموذج المسعف
                if (medicLogin) medicLogin.style.display = 'block';
                if (adminLogin) adminLogin.style.display = 'none';
            } else {
                // إظهار نموذج المسعف افتراضياً
                if (medicLogin) medicLogin.style.display = 'block';
                if (adminLogin) adminLogin.style.display = 'none';
            }
            
            // تحديث قائمة المسعفين
            updateMedicSelect();
        });

        /**
         * معالج تسجيل دخول المسعف
         */
        async function handleMedicLogin(e) {
    e.preventDefault();
    console.log('Form submitted - handleMedicLogin called');
    
    const code = document.getElementById('paramedicCode')?.value.trim();
    const discordId = document.getElementById('discordId')?.value.trim();
    const loginBtn = document.querySelector('#medicLoginForm button[type="submit"]');

    console.log('Input values - Code:', code, 'DiscordId:', discordId);

    if (!code || !discordId) {
        showNotification('بيانات ناقصة', 'الرجاء إدخال الكود وكلمة السر لتسجيل الدخول', 'error');
        return;
    }

    try {
        // إظهار حالة التحميل
        const originalBtnText = loginBtn?.innerHTML;
        if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> جاري التحقق...';
        }

        // تنظيف الجلسات القديمة أولاً
        localStorage.removeItem('currentUser');
        localStorage.removeItem('activeMedic');
        localStorage.removeItem('activeCode');
        localStorage.removeItem('discordId');
        
        // التحقق من بيانات المدير أولاً
        console.log('Checking admin credentials - Code:', code, 'Expected: admin, DiscordId:', discordId, 'Expected: admin123');
        if (code === 'admin' && discordId === 'admin123') {
            console.log('Admin credentials matched - Creating session');
            // حفظ بيانات جلسة المدير
            const adminSession = {
                id: 'admin-' + Date.now(),
                username: 'admin',
                name: 'وزير الصحة',
                type: 'admin',
                level: 'minister',
                loginTime: new Date().toISOString()
            };
            
            localStorage.setItem('currentUser', JSON.stringify(adminSession));
            console.log('Admin session saved:', adminSession);
            
            showNotification('بيانات صحيحة', 'مرحباً وزير الصحة! تم تسجيل دخولك بنجاح وجاري التحويل للوحة التحكم...', 'success');
            
            // التحويل إلى صفحة المدير
            setTimeout(() => {
                console.log('Redirecting to admin.html');
                window.location.href = 'admin.html';
            }, 1500);
            return;
        }

        // التحقق من بيانات نائب الوزير
        if (code === 'admin2' && discordId === 'admin456') {
            // حفظ بيانات جلسة نائب الوزير
            const adminSession = {
                id: 'admin2-' + Date.now(),
                username: 'admin2',
                name: 'نائب وزير الصحة',
                type: 'admin',
                level: 'deputy',
                loginTime: new Date().toISOString()
            };
            
            localStorage.setItem('currentUser', JSON.stringify(adminSession));
            
            showNotification('بيانات صحيحة', 'مرحباً نائب وزير الصحة! تم تسجيل دخولك بنجاح وجاري التحويل للوحة التحكم...', 'success');
            
            // التحويل إلى صفحة المدير
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 1500);
            return;
        }

        // البحث في قائمة المسعفين من Firebase و localStorage
        const medicsList = JSON.parse(localStorage.getItem('medicsList') || '[]');
        
        // البحث أولاً في localStorage (المسعفين المحليين)
        let medic = medicsList.find(m => m.code === code);
        
        // التحقق من كلمة السر المنفصلة إذا وجدت
        if (medic) {
            const savedPassword = localStorage.getItem('password_' + medic.id);
            if (savedPassword) {
                // استخدام كلمة السر المنفصلة
                if (savedPassword !== discordId) {
                    medic = null; // لا تتطابق كلمة السر
                }
            } else {
                // استخدام كلمة السر من بيانات المسعف (للحالات القديمة)
                if (medic.discord !== discordId) {
                    medic = null; // لا تتطابق كلمة السر
                }
            }
        }
        
        // إذا لم يتم العثور على المسعف محلياً، ابحث في Firebase
        if (!medic) {
            try {
                const firebaseMedics = await firebaseHelpers.getAllMedics();
                medic = firebaseMedics.find(m => m.code === code && m.discord === discordId);
                
                // إذا تم العثور على المسعف في Firebase، أضفه إلى localStorage
                if (medic) {
                    medicsList.push(medic);
                    localStorage.setItem('medicsList', JSON.stringify(medicsList));
                }
            } catch (error) {
                console.error('خطأ في البحث في Firebase:', error);
            }
        }
        
        // إعادة تعيين حالة الزر
        if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.innerHTML = originalBtnText;
        }

        if (!medic) {
            showNotification('خطأ في البيانات', 'الكود أو كلمة السر غير صحيحة. يرجى التحقق من البيانات والمحاولة مرة أخرى', 'error');
            return;
        }

        // حفظ بيانات الجلسة للمسعف
        localStorage.setItem('activeCode', medic.id);
        localStorage.setItem('discordId', medic.discord);
        localStorage.setItem('activeMedic', JSON.stringify(medic));

        showNotification('بيانات صحيحة', `مرحباً بك ${medic.name}! تم تسجيل دخولك بنجاح وجاري التحويل للصفحة الرئيسية...`, 'success');
        
        // تحديث قائمة المسعفين في صفحة تسجيل الدخول (إذا كانت موجودة)
        updateMedicSelect();
        
        // الانتقال إلى الصفحة الرئيسية بعد 1.5 ثانية
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
        
    } catch (error) {
        console.error('خطأ في تسجيل الدخول:', error);
        showNotification('خطأ في النظام', 'حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى', 'error');
        
        // إعادة تعيين حالة الزر في حالة الخطأ
        if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'تسجيل الدخول';
        }
    }
}

        // تسجيل دخول الموحد
        document.addEventListener('DOMContentLoaded', function() {
            const medicForm = document.getElementById('medicLoginForm');
            if (medicForm) {
                console.log('Adding event listener to medicLoginForm');
                medicForm.addEventListener('submit', handleMedicLogin);
            } else {
                console.log('medicLoginForm not found');
            }
        });
    </script>
    
    <!-- Bootstrap JS مع Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
