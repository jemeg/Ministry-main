<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>تسجيل الدخول - وزارة الصحة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-container {
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            background: white;
        }
        .login-header { text-align: center; margin-bottom: 25px; }
        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }
        .logo-shine {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(250, 109, 109, 0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .ministry-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        }
        .title-container h2 { margin: 0; line-height: 1.4; }
        .title-highlight {
            color: #0d6efd;
            font-weight: 800;
            font-size: 1.6rem;
            display: block;
        }
        .ministry-name {
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
            display: block;
        }
        .login-box {
            background: linear-gradient(135deg, #ff837f 0%, #ff6b6b 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 0;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .tab-btn:not(.active) { background: rgba(255,255,255,0.5); color: #333; }
        .tab-btn:not(.active):hover { background: rgba(255,255,255,0.8); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .request-status {
            background: linear-gradient(135deg, #fff3cd 0%, #ffffff 100%);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
        }
        .request-status i { font-size: 3rem; color: #ffc107; margin-bottom: 15px; }
        .request-status h5 { color: #856404; font-weight: 700; margin-bottom: 10px; }
        .request-status p { color: #6c757d; font-size: 0.95rem; margin-bottom: 15px; }
        footer {
            text-align: center;
            padding: 15px;
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .form-label { color: white; font-weight: 600; margin-bottom: 8px; }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.9);
        }
        .form-control:focus {
            border-color: white;
            box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.3);
            background: white;
        }
        .btn-primary, .btn-success {
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-primary:hover, .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .custom-notification { font-family: 'Cairo', sans-serif; }
        .storage-error {
            text-align: center;
            padding: 30px;
        }
        .storage-error i { color: #ffc107; margin-bottom: 20px; }
        .storage-error h3 { color: #dc3545; margin-bottom: 15px; }
        .storage-error p { color: #6c757d; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container" id="loginContainer">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo-shine"></div>
                    <img src="logo.png" alt="شعار وزارة الصحة" class="ministry-logo">
                </div>
                <div class="title-container">
                    <h2><span class="title-highlight">نظام إدارة الإسعاف</span></h2>
                    <h2><span class="ministry-name">وزارة الصحة</span></h2>
                </div>
            </div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
                <button class="tab-btn" onclick="switchTab('register')">
                    <i class="fas fa-user-plus"></i> طلب حساب جديد
                </button>
            </div>

            <div id="loginTab" class="tab-content active">
                <div id="loginForm" class="login-box">
                    <form id="medicLoginForm">
                        <div class="mb-3">
                            <label for="paramedicCode" class="form-label">الكود</label>
                            <input type="text" id="paramedicCode" class="form-control text-center" 
                                   placeholder="أدخل الكود" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة السر</label>
                            <input type="password" id="password" class="form-control text-center" 
                                   placeholder="كلمة السر" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                        </button>
                    </form>
                </div>
            </div>

            <div id="registerTab" class="tab-content">
                <div id="registerForm" class="login-box">
                    <div class="text-center mb-3" style="color: white;">
                        <i class="fas fa-clipboard-list fa-2x mb-2"></i>
                        <p class="mb-0" style="font-size: 0.85rem;">أدخل بياناتك وسيتم مراجعة طلبك من الإدارة</p>
                    </div>
                    <form id="medicRegisterForm">
                        <div class="mb-3">
                            <label for="registerName" class="form-label">اسمك في الديسكورد</label>
                            <input type="text" id="registerName" class="form-control text-center" 
                                   placeholder="مثال: Ahmed#1234" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="registerCode" class="form-label">الكود</label>
                            <input type="text" id="registerCode" class="form-control text-center" 
                                   placeholder="مثال: H-100" required autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-paper-plane"></i> إرسال طلب التأكيد
                        </button>
                    </form>
                </div>
                <div id="requestPending" class="request-status" style="display: none;">
                    <i class="fas fa-hourglass-half"></i>
                    <h5>طلبك قيد المراجعة</h5>
                    <p>تم إرسال طلبك إلى الإدارة. سيتم إعلامك عند قبوله.</p>
                    <button class="btn btn-sm btn-outline-warning mt-2" onclick="cancelRequest()">
                        <i class="fas fa-times"></i> إلغاء الطلب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 30px 20px; background: linear-gradient(135deg, #1e275e 0%, #101742 100%); border-radius: 20px; border: 2px solid #d4af37; text-align: center; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #d4af37, #e74c3c, #3498db, #d4af37, transparent);"></div>
        <div style="position: relative; z-index: 1;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px;">
                <img src="logo.png" alt="شعار" style="width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));">
                <div style="height: 40px; width: 2px; background: linear-gradient(to bottom, transparent, #d4af37, transparent);"></div>
                <div>
                    <h4 style="margin: 0; color: #d4af37; font-weight: 800; font-size: 1.3rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">وزارة الصحة</h4>
                    <p style="margin: 0; color: #a0aec0; font-size: 0.85rem; font-weight: 500;">Ministry of Health</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(212, 175, 55, 0.2);">
                <span style="color: #e2e8f0; font-size: 0.9rem; font-weight: 600;">
                    <i class="fas fa-copyright" style="color: #d4af37; margin-left: 5px;"></i> 2026 - 2027
                </span>
                <span style="color: #d4af37; font-size: 0.9rem; font-weight: 600;">
                    <i class="fas fa-shield-alt" style="margin-left: 5px;"></i> جميع الحقوق محفوظة
                </span>
                <span style="color: #e2e8f0; font-size: 0.9rem; font-weight: 600;">
                    <i class="fas fa-pen-nib" style="color: #e74c3c; margin-left: 5px;"></i> تصميم وتطوير: <span style="font-family: 'Great Vibes', cursive; font-size: 1.2rem; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);">𝓖𝓱𝓪𝔃𝔀𝓪𝓷</span>
                </span>
            </div>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #d4af37, #e74c3c, #3498db, #d4af37, transparent);"></div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="shared.js"></script>
    <script src="login.js"></script>
</body>
</html>
